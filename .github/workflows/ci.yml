name: CI
on:
  push:
    branches: [master, main, "upgrade/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path './node_modules' -prune -o -path './code-review-platform/node_modules' -prune -o -type f -name '*.js' -print0)
      - name: Dependency audit (report)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

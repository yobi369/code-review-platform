name: CI
on:
  push:
    branches: [master, main, "upgrade/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Validate Compose configuration
        run: JWT_SECRET=ci-test-secret-with-more-than-32-characters docker compose config --quiet
      - name: Build production container
        run: docker build --tag code-review-platform:ci .
